<!DOCTYPE html>
<html>
<head>
  <title>EPISODE GUIDE // JCJENSON TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

  <style>
    body {
      background:#2f2c43;
      color:#c77bff;
      font-family:'Michroma',sans-serif;
      margin:0;
      padding:20px;
    }

    .nav-container {
  display: flex;
  align-items: flex-start;
  gap: 30px;
}

    .terminal {
      border:2px solid #6a00ff;
      padding:30px;
      border-radius:10px;
      background:#1e1428;
      box-shadow:0 0 20px #6a00ff;
      max-width:1000px;
      margin:0 auto;
    }

    h1.glitch {
      font-size:3.5rem;
      margin:0 0 30px;
    }

    .grid {
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }

    .card {
      background:#2a1f38;
      border:1px solid #6a00ff;
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 0 15px #6a00ff55;
      transition:0.4s;
    }

    .card:hover {
      transform:translateY(-8px);
      box-shadow:0 0 30px #6a00ff;
    }

    .card img {
      width:100%;
      height:320px;
      object-fit:cover;
    }

    .info {
      padding:15px;
      text-align:center;
    }

    .name {
      font-size:1.5rem;
      margin:0;
      color:#ff66ff;
    }

    .status {
      font-size:0.9rem;
      color:#ffcc00;
    }

    .clearance {
      font-size:0.8rem;
      color:#ff0066;
      margin-top:8px;
    }

    .button {
      display:inline-block;
      background:#6a00ff33;
      color:#c77bff;
      padding:10px 18px;
      margin:20px 0;
      border:2px solid #6a00ff;
      border-radius:6px;
      text-decoration:none;
      transition:0.3s;
    }

    .button:hover {
      background:#6a00ff;
      color:#fff;
      box-shadow:0 0 20px #6a00ff;
    }

    .back {
      text-align:center;
      margin-top:40px;
    }

  </style>
</head>

<body>
<div class="terminal">
  <h1 class="glitch" data-text="EPISODE GUIDE">EPISODE GUIDE</h1>
  <p><strong>ACCESS LEVEL:</strong> Uzi Doorman (admin override active)</p>

  <div class="grid">

    <div class="card">
      <img src="images/uzi.png">
      <div class="info">
        <h2 class="name">EPISODE 1: PILOT</h2>
        <h4 class="status"></h4>
        <h5 class="clearance"></h5>
        <p></p>
      </div>
    </div>

  </div>

  <div class="back">
    <a href="index.html" class="button">← BACK TO TERMINAL</a>
  </div>
</div>


</body>
</html>
